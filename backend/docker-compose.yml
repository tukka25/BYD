services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: promptdash-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://promptdash:promptdash@postgres:5432/promptdash
      UPLOAD_DIR: /app/uploads
      API_V1_STR: /api/v1
      PROJECT_NAME: PromptDash API
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen3:8b
      OLLAMA_TIMEOUT_SECONDS: 9000
      # Set 0 to disable endpoint-level timeout.
      WORKFLOW_TIMEOUT_SECONDS: 0
      SECRET_KEY: replace-with-strong-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      ENCRYPTION_KEY: m3xwSeF4J38MxGfM9Tz11LeG5m8Wz8Y5w6rkaI0sD9A=
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app
    volumes:
      - ./uploads:/app/uploads
      - ./app:/app/app
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    image: postgres:16
    container_name: promptdash-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: promptdash
      POSTGRES_USER: promptdash
      POSTGRES_PASSWORD: promptdash
    ports:
      - "5432:5432"
    volumes:
      - promptdash_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promptdash -d promptdash"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  promptdash_pgdata:
